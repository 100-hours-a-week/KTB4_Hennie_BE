name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devbadak-backend

concurrency:
  # 배포가 겹치지 않도록 직렬화한다. 배포 중 취소는 위험하므로 취소하지 않는다.
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        env:
          JWT_SECRET: Y2ktb25seS1kdW1teS1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZSEh
        run: ./gradlew test

  build-and-push:
    name: 이미지 빌드 및 GHCR push
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 및 push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # 패키지를 소스 레포에 연결해 준다.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: SSH 접속 후 backend 컨테이너 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # GITHUB_TOKEN은 이 실행 동안만 유효하므로 별도 PAT 없이 pull 할 수 있다.
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            COMPOSE_FILE="$HOME/devbadak-infra/compose.prod.yaml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "compose 파일이 없습니다: $COMPOSE_FILE"
              echo "INFRA 레포의 CD를 먼저 실행해 파일을 배치하세요."
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/devbadak-infra
            docker compose -f compose.prod.yaml pull backend
            # --no-deps: FE 레포가 관리하는 frontend 서비스를 건드리지 않는다.
            docker compose -f compose.prod.yaml up -d --no-deps backend
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
