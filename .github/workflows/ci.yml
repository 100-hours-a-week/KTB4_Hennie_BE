name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        env:
          # contextLoads() 테스트가 JWT_SECRET을 요구하므로 CI 전용 더미 값을 주입한다.
          # 실제 운영 시크릿이 아니며, 배포에는 EC2의 .env 값이 사용된다.
          JWT_SECRET: Y2ktb25seS1kdW1teS1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZSEh
        run: ./gradlew test

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          retention-days: 7
