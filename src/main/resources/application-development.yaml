# 로컬 개발용
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:devbadak}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:devbadak}
    password: ${DB_PASSWORD:devbadak}
  h2:
    console:
      enabled: false
  # 로컬은 Hibernate가 직접 스키마를 반영하므로 Flyway는 끈다.
  # 켜두면 Flyway가 만든 스키마 위에 Hibernate가 또 손대서 이력과 실제가 어긋난다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      # 로컬은 엔티티 기준으로 스키마를 자동 반영한다.
      # 단 update는 없는 테이블/컬럼을 추가만 하고 기존 컬럼의 타입·길이는 바꾸지 않는다.
      # length를 줄이거나 컬럼명을 바꿨다면 로컬 DB를 다시 만들어야 한다.
      ddl-auto: update
