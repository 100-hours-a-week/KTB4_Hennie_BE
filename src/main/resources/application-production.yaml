# 배포용
# 접속 정보는 EC2의 infra/.env -> compose.prod.yaml을 거쳐 환경변수로 주입된다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:devbadak}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # 스키마는 Flyway가 만들고 Hibernate는 검증만 한다.
      # 엔티티를 바꿨다면 db/migration에 마이그레이션을 추가해야 기동에 성공한다.
      ddl-auto: validate
    show-sql: false
