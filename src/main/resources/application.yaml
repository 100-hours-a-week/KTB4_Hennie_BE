spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: springdatajpa
  sql:
    init:
      mode: never
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  profiles:
    default: production
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-seconds: ${JWT_ACCESS_TOKEN_EXP_SECONDS:300}
  refresh-token-exp-seconds: ${JWT_REFRESH_TOKEN_EXP_SECONDS:1209600}

refresh-cookie:
  secure: ${REFRESH_COOKIE_SECURE:false}
  same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  max-age-seconds: ${REFRESH_COOKIE_MAX_AGE_SECONDS:1209600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5173,http://localhost:5173}

image:
  upload-directory: ./uploads
  base-url: http://localhost:8080/uploads
